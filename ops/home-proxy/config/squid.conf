# O proxy escuta HTTP somente dentro da rede privada Tailscale. O tunel WireGuard
# protege a autenticacao Basic entre o Worker e o Squid.
http_port 3128

# Permite destinos HTTPS dinamicos para suportar lojas privadas cadastradas.
# A restricao de acesso fica a cargo da Tailscale e da autenticacao do Squid.
acl SSL_ports port 443
acl Safe_ports port 443
acl CONNECT method CONNECT

auth_param basic program /usr/lib/squid/basic_ncsa_auth /run/secrets/squid_users
auth_param basic realm TCGLooker-Proxy
auth_param basic credentialsttl 2 hours
auth_param basic casesensitive on
acl authenticated proxy_auth REQUIRED

# A ordem importa: rejeite portas inseguras antes de solicitar credenciais.
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow authenticated
http_access deny all

# Este proxy e apenas um gateway de scraping, nao um cache compartilhado.
cache deny all
cache_mem 8 MB
maximum_object_size_in_memory 0 KB

# Evita divulgar o IP de origem do cliente para os sites consultados.
forwarded_for delete
via off

# Limites defensivos para conexoes abandonadas ou lentas.
connect_timeout 20 seconds
request_timeout 1 minute
read_timeout 2 minutes
client_lifetime 30 minutes
shutdown_lifetime 3 seconds

# Logs vao para o Docker. Em HTTPS, o access log registra o host do CONNECT,
# mas nao o conteudo cifrado da requisicao.
access_log stdio:/dev/stdout
cache_log /dev/stderr
cache_store_log none
log_mime_hdrs off

pid_filename /run/squid/squid.pid
coredump_dir /tmp
visible_hostname tcglooker-home-proxy

